name: Daily Habr parser

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 06:00 MSK
  workflow_dispatch:
    inputs:
      pages:
        description: "Max listing pages to crawl (CLOSESPIDER_PAGECOUNT)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: habr-parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-root

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run parser and push updated database
        env:
          PAGES: ${{ github.event.inputs.pages || '30' }}
        run: bash parser.sh
